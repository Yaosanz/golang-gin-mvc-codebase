definitions:
  dto.CreateUserDTO:
    properties:
      email:
        example: john.doe@email.com
        type: string
      is_active:
        example: true
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: strongpassword
        maxLength: 255
        minLength: 8
        type: string
      phone:
        example: "+1234567890"
        type: string
      username:
        example: John Doe
        maxLength: 255
        minLength: 2
        type: string
    required:
    - email
    - name
    - password
    - username
    type: object
  dto.UpdateUserDTO:
    properties:
      email:
        example: ""
        type: string
      is_active:
        example: true
        type: boolean
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: strongpassword
        maxLength: 255
        minLength: 8
        type: string
      phone:
        example: "+1234567890"
        type: string
      username:
        example: John Doe
        maxLength: 255
        minLength: 2
        type: string
    type: object
  swagger.Pagination:
    properties:
      current_page:
        type: integer
      last_page:
        type: integer
      per_page:
        type: integer
      total_page:
        type: integer
      total_row:
        type: integer
    type: object
  swagger.ResponseError:
    properties:
      data: {}
      error: {}
      message:
        example: something went wrong!
        type: string
      success:
        example: false
        type: boolean
    type: object
  swagger.ResponseOk:
    properties:
      data: {}
      error: {}
      message:
        example: ok
        type: string
      success:
        example: true
        type: boolean
    type: object
  swagger.UserPaginatedResponse:
    properties:
      contents:
        items:
          $ref: '#/definitions/swagger.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/swagger.Pagination'
    type: object
  swagger.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Get a list of users with pagination
      parameters:
      - default: true
        description: turn pagination on/off
        in: query
        name: paginate
        type: boolean
      - default: 1
        description: Page Number
        in: query
        name: page
        type: integer
      - default: 15
        description: How many record per page
        in: query
        name: limit
        type: integer
      - default: created_at
        description: sort list by field name
        in: query
        name: sort_by
        type: string
      - default: asc
        description: sort direction desc/asc
        enum:
        - asc
        - desc
        in: query
        name: sort_direction
        type: string
      - description: search list by allowed fields
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/swagger.ResponseOk'
            - properties:
                data:
                  $ref: '#/definitions/swagger.UserPaginatedResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.ResponseError'
      summary: List of users
      tags:
      - User
    post:
      consumes:
      - application/json
      parameters:
      - description: Create user
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.ResponseOk'
      summary: Create user
      tags:
      - User
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/swagger.ResponseOk'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/swagger.ResponseError'
      summary: Delete user by ID
      tags:
      - User
    get:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/swagger.ResponseOk'
            - properties:
                data:
                  $ref: '#/definitions/swagger.UserResponse'
              type: object
      summary: Get user by ID
      tags:
      - User
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update user
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/swagger.ResponseOk'
            - properties:
                data:
                  $ref: '#/definitions/swagger.UserResponse'
              type: object
      summary: Update user
      tags:
      - User
swagger: "2.0"
